<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08080a">
<title>NOVA – All-in-One Plattform</title>
<link rel="stylesheet" href="css/nova.css">
</head>
<body>
<div id="boot"><span class="logo">N</span></div>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menü öffnen"></button>
      <div class="search-wrap">
        <input id="q" type="search" autocomplete="off" placeholder="Module suchen …" aria-label="Module suchen">
        <div id="results" class="results" hidden></div>
      </div>
    </header>
    <div id="banner" class="banner" hidden>Der lokale Speicher (IndexedDB) ist in diesem Browser nicht verfügbar. Daten können nicht gespeichert werden.</div>
    <section id="view" class="view"></section>
  </main>
</div>
<div id="toast" class="toast" role="status"></div>
<noscript>NOVA benötigt JavaScript.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
